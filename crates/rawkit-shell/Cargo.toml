[package]
name = "rawkit-shell"
description = "The desktop shell. Owns the window and the surface; the only crate that knows Tauri exists."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rawkit-editstate.workspace = true
rawkit-engine.workspace = true
rawkit-session.workspace = true
rawkit-decode.workspace = true
rawkit-export.workspace = true
rawkit-catalog.workspace = true
serde_json.workspace = true
tauri.workspace = true
anyhow.workspace = true
wgpu.workspace = true

# The canvas widget is X11-specific. Nothing above this line is, which is what
# keeps the engine buildable on a machine with no windowing system at all.
[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
gdkx11.workspace = true
x11.workspace = true

[build-dependencies]
tauri-build.workspace = true
