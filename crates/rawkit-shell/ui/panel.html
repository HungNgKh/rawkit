<!doctype html>
<meta charset="utf-8">
<title>rawkit</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1e1e22; color: #e8e8ea;
               font: 13px/1.4 system-ui, sans-serif; }
  main { padding: 14px 18px; display: flex; gap: 28px; align-items: flex-start; }
  section { min-width: 260px; }
  /* Six tone controls in one column would need a taller panel, and the panel is
     chrome sitting on top of the photograph. Two columns instead: same height,
     same single "Tone" heading, no canvas surrendered. */
  section.split { display: grid; grid-template-columns: repeat(2, minmax(250px, 1fr));
                  grid-template-rows: repeat(4, auto); grid-auto-flow: column;
                  column-gap: 28px; }
  section.split h1 { grid-column: 1 / -1; grid-row: 1; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 10px; letter-spacing: .02em; }
  label { display: flex; align-items: center; gap: 10px; margin: 7px 0; }
  label span:first-child { width: 74px; color: #9a9aa2; }
  input[type=range] { flex: 1; }
  output { width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
  button { background: #303038; color: inherit; border: 1px solid #45454f;
           border-radius: 5px; padding: 4px 11px; font: inherit; cursor: pointer; }
  button:hover { background: #3a3a44; }
  .row { display: flex; gap: 7px; margin-top: 10px; }
  #log { color: #7d7d87; margin-top: 12px; font-variant-numeric: tabular-nums; }
  #log.refused { color: #e0705f; }

  #cull { display: flex; align-items: baseline; gap: 18px; padding: 8px 18px;
          border-bottom: 1px solid #2c2c34; font-variant-numeric: tabular-nums; }
  #cull.hidden { display: none; }
  #frame { font-weight: 600; }
  #position, #counts, #keys { color: #7d7d87; }
  #keys { margin-left: auto; font-size: 11px; }
  #stars { letter-spacing: 2px; color: #d8bf63; min-width: 62px; }
  #mode { color: #8e8e98; text-transform: uppercase; letter-spacing: .08em; font-size: 11px;
          border: 1px solid #3a3a44; border-radius: 3px; padding: 1px 6px; }
  #flag.pick { color: #6fc27a; }
  #flag.reject { color: #e0705f; }
</style>

<div id="cull" class="hidden">
  <span id="frame"></span>
  <span id="position"></span>
  <span id="stars"></span>
  <span id="flag"></span>
  <span id="label"></span>
  <span id="counts"></span>
  <span id="mode">loupe</span>
  <span id="keys">G grid · E loupe · R crop · [ ] rotate · M mark · C compare · S copy · A apply · P pick · X reject · Z undo</span>
</div>

<main>
  <section class="split">
    <h1>Tone</h1>
    <label><span>Exposure</span>
      <input id="exposure" type="range" min="-4" max="4" step="0.01" value="0">
      <output id="exposure-value">0.00</output></label>
    <label><span>Contrast</span>
      <input id="contrast" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="contrast-value">0.00</output></label>
    <label><span>Highlights</span>
      <input id="highlights" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="highlights-value">0.00</output></label>
    <label><span>Shadows</span>
      <input id="shadows" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="shadows-value">0.00</output></label>
    <label><span>Whites</span>
      <input id="whites" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="whites-value">0.00</output></label>
    <label><span>Blacks</span>
      <input id="blacks" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="blacks-value">0.00</output></label>
  </section>

  <section>
    <h1>White balance</h1>
    <label><span>Temp</span>
      <input id="temperature" type="range" min="2000" max="12000" step="10" value="5500">
      <output id="temperature-value">as shot</output></label>
    <label><span>Tint</span>
      <input id="tint" type="range" min="-100" max="100" step="1" value="0">
      <output id="tint-value">0</output></label>
    <div class="row"><button id="as-shot">As shot</button></div>
  </section>

  <section>
    <h1>View</h1>
    <div class="row">
      <button data-zoom="0.5">−</button>
      <button data-fit>Fit</button>
      <button data-zoom="1" data-absolute>1:1</button>
      <button data-zoom="2">+</button>
    </div>
    <div class="row">
      <button data-pan="-200,0">←</button>
      <button data-pan="0,-200">↑</button>
      <button data-pan="0,200">↓</button>
      <button data-pan="200,0">→</button>
    </div>
    <div id="log">ready</div>
  </section>
</main>

<script type="module">
  // The whole of the UI's contract with the engine. Commands go down, events
  // come back; no pixels cross in either direction, and there is no API here
  // that could carry one.
  const invoke = window.__TAURI__.core.invoke;
  const log = document.getElementById("log");

  let scale = 1;

  async function send(command) {
    const event = await invoke("apply", { command });
    log.className = event.event === "refused" ? "refused" : "";
    log.textContent =
      event.event === "refused"
        ? `refused ${event.command}: ${event.reason}`
        : event.event === "edit_changed"
          ? `edit ${event.generation}`
          : "view changed";
    return event;
  }

  // A drag emits far more commands than the GPU renders frames. That is fine
  // and deliberate: the session has no queue, so the extra ones cost a lock and
  // a float each, and only the last one is ever rendered.
  const slider = (id, build, format) => {
    const input = document.getElementById(id);
    const out = document.getElementById(id + "-value");
    input.addEventListener("input", () => {
      const value = parseFloat(input.value);
      out.textContent = format(value);
      send(build(value));
    });
  };

  slider("exposure", v => ({ command: "set_exposure", params: v }), v => v.toFixed(2));
  slider("contrast", v => ({ command: "set_contrast", params: v }), v => v.toFixed(2));
  slider("highlights", v => ({ command: "set_highlights", params: v }), v => v.toFixed(2));
  slider("shadows", v => ({ command: "set_shadows", params: v }), v => v.toFixed(2));
  slider("whites", v => ({ command: "set_whites", params: v }), v => v.toFixed(2));
  slider("blacks", v => ({ command: "set_blacks", params: v }), v => v.toFixed(2));
  slider("temperature", v => ({ command: "set_temperature", params: v }), v => `${v | 0} K`);
  slider("tint", v => ({ command: "set_tint", params: v }), v => `${v | 0}`);

  document.getElementById("as-shot").addEventListener("click", () => {
    document.getElementById("temperature-value").textContent = "as shot";
    send({ command: "set_temperature", params: null });
  });

  for (const button of document.querySelectorAll("[data-zoom]")) {
    button.addEventListener("click", async () => {
      const factor = parseFloat(button.dataset.zoom);
      scale = button.hasAttribute("data-absolute") ? factor : scale * factor;
      // Anchor at the centre of the canvas: these are buttons, so there is no
      // cursor to hold still.
      const { viewport } = await invoke("snapshot");
      await send({
        command: "zoom_to",
        params: { scale, anchor: [viewport.size[0] / 2, viewport.size[1] / 2] },
      });
    });
  }

  document.querySelector("[data-fit]").addEventListener("click", async () => {
    await send({ command: "fit_to_view" });
    scale = (await invoke("snapshot")).viewport.scale;
  });

  for (const button of document.querySelectorAll("[data-pan]")) {
    const [dx, dy] = button.dataset.pan.split(",").map(Number);
    button.addEventListener("click", () => send({ command: "pan", params: { dx, dy } }));
  }

  // Pointer input over the *canvas* does not reach this page: the canvas is its
  // own X window, which is exactly what stops it fighting the webview. Drag and
  // scroll therefore need native event handling on that window, and until then
  // the view is driven by these buttons.
  invoke("snapshot").then(s => {
    scale = s.viewport.scale;
    log.textContent = `${s.image[0]}x${s.image[1]}`;
  });

  // Put the controls where the *session* says they are.
  //
  // The page is not the source of truth and never was — it just used to be the
  // only thing that changed the edit, so nobody noticed. Moving between
  // photographs restores each one's stored edit underneath the page, and a
  // slider left showing the last frame's exposure is worse than a wrong readout:
  // the next drag sends that stale value as if it were a decision.
  // Which slider the pointer is currently holding, so a sync does not yank the
  // thumb out from under a drag. Focus is the wrong test and was the first
  // attempt: a slider keeps focus after the click that moved it, so the readout
  // would update on navigation while the thumb stayed where it was — the two
  // halves of one control disagreeing, which is worse than either being wrong.
  let dragging = null;
  const TONE = ["exposure", "contrast", "highlights", "shadows", "whites", "blacks"];
  for (const id of [...TONE, "temperature", "tint"]) {
    document.getElementById(id).addEventListener("pointerdown", () => (dragging = id));
  }
  document.addEventListener("pointerup", () => (dragging = null));

  const setSlider = (id, value, format) => {
    if (dragging !== id) document.getElementById(id).value = value;
    document.getElementById(id + "-value").textContent = format(value);
  };

  const sync = state => {
    setSlider("exposure", state.tone.exposure_ev, v => Number(v).toFixed(2));
    for (const id of TONE.slice(1)) {
      setSlider(id, state.tone[id], v => Number(v).toFixed(2));
    }
    setSlider("tint", state.white_balance.tint, v => `${v | 0}`);
    const temp = state.white_balance.temperature_k;
    setSlider("temperature", temp ?? 5500, () => (temp === null ? "as shot" : `${temp | 0} K`));
  };

  // Polled rather than pushed, because the edit changes on the render loop's
  // schedule: a keypress leaves a request and the photograph is not loaded until
  // a frame or two later. Four times a second is far below anything a person
  // notices and costs a lock and a serialise.
  let seen = -1;
  setInterval(async () => {
    const s = await invoke("snapshot");
    if (s.generation !== seen) {
      seen = s.generation;
      sync(s.state);
    }
    // The canvas changes the selection too — clicking a cell, and
    // double-clicking to open it — and none of that passes through this page.
    // Without this the strip goes on describing the frame you were on two
    // clicks ago, which is a readout lying rather than merely lagging.
    show(await invoke("cull_view"));
  }, 250);

  // ---- Culling -------------------------------------------------------------
  //
  // Keys are handled here rather than natively because a keyboard is the one
  // input that does *not* need the canvas window: the webview holds focus, and
  // this works identically on all three platforms without a line of per-OS code.
  // Pointer input over the canvas is the opposite case, and is why `canvas.rs`
  // exists.

  const strip = document.getElementById("cull");
  const show = view => {
    if (!view) return;
    strip.classList.remove("hidden");
    document.getElementById("frame").textContent = view.filename;
    document.getElementById("position").textContent = `${view.position} / ${view.total}`;
    document.getElementById("stars").textContent =
      "★".repeat(view.rating ?? 0) + "☆".repeat(5 - (view.rating ?? 0));
    const flag = document.getElementById("flag");
    flag.textContent = view.flag === "pick" ? "PICK" : view.flag === "reject" ? "REJECT" : "";
    flag.className = view.flag ?? "";
    const label = document.getElementById("label");
    label.textContent = view.colour ? view.colour.toUpperCase() : "";
    label.style.color = { red: "#e0705f", yellow: "#d8bf63", green: "#6fc27a", blue: "#6f9ade" }[view.colour] ?? "";
    document.getElementById("counts").textContent =
      `${view.picks} picked · ${view.rejects} rejected` +
      (view.marked ? ` · ${view.marked} marked${view.is_marked ? " ✓" : ""}` : "") +
      // A clipboard nobody can see is a key that sometimes does nothing.
      (view.copied ? " · settings copied" : "");
    setMode(view.mode);
  };

  const act = async (action, value) => {
    try {
      show(await invoke("cull", { action: value === undefined ? { action } : { action, value } }));
    } catch (e) {
      log.className = "refused";
      log.textContent = String(e);
    }
  };

  // A held arrow key repeats far faster than a RAW decodes. Every press is still
  // sent — the library keeps only the latest request and the render loop reads
  // it once per frame, so this coalesces for the same reason a slider drag does.
  function setMode(name) {
    if (document.getElementById("mode").textContent === name) return;
    document.getElementById("mode").textContent = name;
    // The grid is laid out from the canvas, so the view controls beside it are
    // about a photograph that is not on screen. Dimmed rather than removed, so
    // the panel does not jump when the mode changes.
    document.querySelector("main").style.opacity = name === "grid" ? 0.45 : 1;
  }

  document.addEventListener("keydown", event => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const key = event.key;
    // A focused control owns its own keys. Without this, arrows move the slider
    // *and* the selection, and a digit rates the photograph while you are
    // trying to type into something — which was survivable with two sliders and
    // is not with six. Escape is the way back out, so it stays ours.
    const editing = event.target.closest("input, button, select, textarea");
    if (editing && key !== "Escape") return;
    if (editing) event.target.blur();
    if (key >= "0" && key <= "5") return act("rate", Number(key)), event.preventDefault();
    // Lightroom's colour keys, and pressing the same one again clears it.
    const labels = { "6": "red", "7": "yellow", "8": "green", "9": "blue" };
    if (labels[key]) return act("colour", labels[key]), event.preventDefault();
    switch (key.toLowerCase()) {
      // G and E, because that is what a Lightroom user's hands already do.
      case "g": act("grid"); break;
      // In crop the same two keys mean take it and throw it away, which is why
      // crop is a mode rather than a flag.
      case "enter":
        if (document.getElementById("mode").textContent === "crop") { act("crop_apply"); break; }
        act("loupe"); break;
      case "escape":
        if (document.getElementById("mode").textContent === "crop") { act("crop_cancel"); break; }
        act("loupe"); break;
      case "e": act("loupe"); break;
      // R for the crop tool, as in Lightroom; the brackets rotate, as in
      // Lightroom's Ctrl+[ and Ctrl+].
      case "r": act("crop"); break;
      case "[": send({ command: "rotate_by", params: -1 }); break;
      case "]": send({ command: "rotate_by", params: 1 }); break;
      // M sets a frame aside, C compares what you set aside.
      case "m": act("mark"); break;
      case "c": act("survey"); break;
      case "arrowright": case " ": act("next"); break;
      case "arrowleft": act("previous"); break;
      // Rows in the grid; neighbours in the loupe. Which one is resolved by the
      // shell, because only it knows how many cells fit across.
      case "arrowdown": act("select_by", 1); break;
      case "arrowup": act("select_by", -1); break;
      case "-": act("cells", -1); break;
      case "=": case "+": act("cells", 1); break;
      case "p": act("pick"); break;
      case "x": act("reject"); break;
      case "u": act("clear_flag"); break;
      // S takes this frame's look, A applies it to everything marked.
      case "s": act("copy_edit"); break;
      case "a": act("paste_edit"); break;
      case "z": act("undo"); break;
      default: return;
    }
    event.preventDefault();
  });

  invoke("cull_view").then(show);
</script>
