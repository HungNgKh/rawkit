<!doctype html>
<meta charset="utf-8">
<title>rawkit</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1e1e22; color: #e8e8ea;
               font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  /* Under a transparent cutout the page covers the whole window and the GPU
     surface is behind it, so everything outside the chrome has to paint nothing
     at all — an opaque pixel there is a pixel of photograph nobody can see.
     Route 3 gives the canvas its own window and never sets this, which is why
     it is a class rather than the default. */
  body.cutout { background: transparent; }
  body.cutout #chrome { background: #1e1e22; }

  /* A column on the right rather than a strip across the top. A landscape
     photograph is limited by its short edge and a strip takes from exactly
     that edge — the same 3:2 frame goes from 864x576 to 1080x720 by moving the
     controls sideways. The width is `PANEL_WIDTH` in main.rs and the two have
     to agree: the canvas is a separate window placed at that boundary, so a
     disagreement is a strip of photograph behind the panel or a strip of
     desktop beside it. */
  #chrome { position: fixed; top: 0; right: 0; bottom: 0; width: 360px;
            display: flex; flex-direction: column; background: #1e1e22;
            border-left: 1px solid #2c2c34; }

  /* The only thing that scrolls, which is the whole point of a column: the
     sections can outgrow the window and nothing has to be taken away to make
     room for the next one. */
  main { flex: 1; overflow-y: auto; overscroll-behavior: contain;
         padding: 4px 16px 20px; }

  details { border-bottom: 1px solid #26262e; }
  details:last-child { border-bottom: 0; }
  summary { font-size: 13px; font-weight: 600; letter-spacing: .02em;
            padding: 10px 0 10px 16px; cursor: pointer; position: relative;
            list-style: none; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  /* Drawn rather than relying on the engine's own marker, which differs between
     WebKitGTK, WKWebView and WebView2 — three platforms showing three shapes
     for the same control is exactly the kind of thing nobody notices until a
     screenshot from someone else's machine looks wrong. */
  summary::before { content: "▸"; position: absolute; left: 0; color: #7d7d87;
                    transition: transform .12s ease; display: inline-block; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary:hover { color: #ffffff; }
  details > *:last-child { margin-bottom: 12px; }

  label { display: flex; align-items: center; gap: 10px; margin: 7px 0; }
  label span:first-child { width: 58px; color: #9a9aa2; flex-shrink: 0; }
  /* `min-width: 0` because a range input has an intrinsic minimum of its own,
     and without it flex refuses to shrink one — which pushed the readout out of
     the column and over the label beside it. */
  input[type=range] { flex: 1; min-width: 0; }
  output { width: 44px; text-align: right; font-variant-numeric: tabular-nums;
           flex-shrink: 0; }
  button { background: #303038; color: inherit; border: 1px solid #45454f;
           border-radius: 5px; padding: 4px 11px; font: inherit; cursor: pointer; }
  button:hover { background: #3a3a44; }
  .row { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
  #log { color: #7d7d87; margin-top: 12px; font-variant-numeric: tabular-nums;
         overflow-wrap: anywhere; }
  #log.refused { color: #e0705f; }
  #keys { color: #7d7d87; font-size: 11px; line-height: 1.7; }

  /* The histogram sits at the top of the column, above everything it describes.
     Fixed height, so a long export line or a wrapping status block can never
     take its space. */
  #bar { padding: 12px 16px 10px; border-bottom: 1px solid #2c2c34;
         font-variant-numeric: tabular-nums; flex-shrink: 0; }
  #histogram { width: 328px; height: 84px; border-radius: 3px;
               background: #141418; display: block; }
  #readout { display: flex; align-items: baseline; gap: 14px; margin-top: 7px; }
  .clip { font-size: 11px; color: #56565e; }
  .clip.lit#clip-white { color: #e0705f; }
  .clip.lit#clip-black { color: #6f9ade; }
  #export { color: #9a9aa2; font-size: 11px; margin-left: auto;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #export.hidden { display: none; }
  #export.failed { color: #e0705f; }

  /* The culling readout, stacked rather than strung along a bar. In a column
     there is no room for a row, and there is no need for one either. */
  #cull { padding: 10px 16px; border-bottom: 1px solid #2c2c34;
          font-variant-numeric: tabular-nums; flex-shrink: 0; }
  #cull.hidden { display: none; }
  #cull .line { display: flex; align-items: baseline; gap: 10px; }
  #cull .line + .line { margin-top: 5px; }
  #frame { font-weight: 600; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
  #position, #counts { color: #7d7d87; font-size: 11px; }
  #counts { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stars { letter-spacing: 2px; color: #d8bf63; margin-left: auto; flex-shrink: 0; }
  #mode { color: #8e8e98; text-transform: uppercase; letter-spacing: .08em; font-size: 11px;
          border: 1px solid #3a3a44; border-radius: 3px; padding: 1px 6px; flex-shrink: 0; }
  #flag.pick { color: #6fc27a; }
  #flag.reject { color: #e0705f; }
</style>

<div id="chrome">
<div id="bar">
  <canvas id="histogram" title="the developed photograph, in the values a file would carry"></canvas>
  <div id="readout">
    <span class="clip" id="clip-white" title="pixels with a channel at full scale">–</span>
    <span class="clip" id="clip-black" title="pixels with nothing in any channel">–</span>
    <span id="export" class="hidden"></span>
  </div>
</div>
<div id="cull" class="hidden">
  <div class="line">
    <span id="frame"></span>
    <span id="stars"></span>
  </div>
  <div class="line">
    <span id="position"></span>
    <span id="flag"></span>
    <span id="label"></span>
    <span id="mode">loupe</span>
  </div>
  <div class="line">
    <span id="counts"></span>
  </div>
</div>

<main>
  <details id="s-tone" open><summary>Tone</summary>
    <label><span>Exposure</span>
      <input id="exposure" type="range" min="-4" max="4" step="0.01" value="0">
      <output id="exposure-value">0.00</output></label>
    <label><span>Contrast</span>
      <input id="contrast" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="contrast-value">0.00</output></label>
    <label><span>Highlights</span>
      <input id="highlights" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="highlights-value">0.00</output></label>
    <label><span>Shadows</span>
      <input id="shadows" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="shadows-value">0.00</output></label>
    <label><span>Whites</span>
      <input id="whites" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="whites-value">0.00</output></label>
    <label><span>Blacks</span>
      <input id="blacks" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="blacks-value">0.00</output></label>
  </details>

  <details id="s-geometry"><summary>Geometry</summary>
    <label><span>Straighten</span>
      <input id="straighten" type="range" min="-15" max="15" step="0.1" value="0">
      <output id="straighten-value">0.0°</output></label>
    <div class="row">
      <button data-rotate="-1">↺</button>
      <button data-rotate="1">↻</button>
    </div>
  </details>

  <details id="s-colour"><summary>Colour</summary>
    <label><span>Saturation</span>
      <input id="saturation" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="saturation-value">0.00</output></label>
    <label><span>Vibrance</span>
      <input id="vibrance" type="range" min="-1" max="1" step="0.01" value="0">
      <output id="vibrance-value">0.00</output></label>
  </details>

  <details id="s-detail"><summary>Detail</summary>
    <label><span>Sharpen</span>
      <input id="sharpen" type="range" min="0" max="1" step="0.01" value="0.4">
      <output id="sharpen-value">0.40</output></label>
    <label><span>Radius</span>
      <input id="sharpen_radius" type="range" min="0.1" max="2" step="0.05" value="1">
      <output id="sharpen_radius-value">1.00</output></label>
    <label><span>Colour NR</span>
      <input id="chroma_noise" type="range" min="0" max="1" step="0.01" value="0.5">
      <output id="chroma_noise-value">0.50</output></label>
  </details>

  <details id="s-white-balance"><summary>White balance</summary>
    <label><span>Temp</span>
      <input id="temperature" type="range" min="2000" max="12000" step="10" value="5500">
      <output id="temperature-value">as shot</output></label>
    <label><span>Tint</span>
      <input id="tint" type="range" min="-100" max="100" step="1" value="0">
      <output id="tint-value">0</output></label>
    <div class="row"><button id="as-shot">As shot</button></div>
  </details>

  <details id="s-view"><summary>View</summary>
    <div class="row">
      <button data-zoom="0.5">−</button>
      <button data-fit>Fit</button>
      <button data-zoom="1" data-absolute>1:1</button>
      <button data-zoom="2">+</button>
    </div>
    <div class="row">
      <button data-pan="-200,0">←</button>
      <button data-pan="0,-200">↑</button>
      <button data-pan="0,200">↓</button>
      <button data-pan="200,0">→</button>
    </div>
    <div id="log">ready</div>
  </details>
  <details id="s-keys">
    <summary>Keys</summary>
    <div id="keys">G grid · E loupe · R crop · [ ] rotate · M mark · C compare · S copy · A apply · P pick · X reject · Z undo cull · ⌃Z undo edit · ⌃E export</div>
  </details>
</main>
</div>

<script type="module">
  // The whole of the UI's contract with the engine. Commands go down, events
  // come back; no pixels cross in either direction, and there is no API here
  // that could carry one.
  const invoke = window.__TAURI__.core.invoke;
  const log = document.getElementById("log");

  let scale = 1;

  async function send(command) {
    const event = await invoke("apply", { command });
    log.className = event.event === "refused" ? "refused" : "";
    log.textContent =
      event.event === "refused"
        ? `refused ${event.command}: ${event.reason}`
        : event.event === "edit_changed"
          ? `edit ${event.generation}`
          : "view changed";
    return event;
  }

  // A drag emits far more commands than the GPU renders frames. That is fine
  // and deliberate: the session has no queue, so the extra ones cost a lock and
  // a float each, and only the last one is ever rendered.
  const slider = (id, build, format) => {
    const input = document.getElementById(id);
    const out = document.getElementById(id + "-value");
    input.addEventListener("input", () => {
      const value = parseFloat(input.value);
      out.textContent = format(value);
      send(build(value));
    });
  };

  slider("exposure", v => ({ command: "set_exposure", params: v }), v => v.toFixed(2));
  slider("contrast", v => ({ command: "set_contrast", params: v }), v => v.toFixed(2));
  slider("highlights", v => ({ command: "set_highlights", params: v }), v => v.toFixed(2));
  slider("shadows", v => ({ command: "set_shadows", params: v }), v => v.toFixed(2));
  slider("whites", v => ({ command: "set_whites", params: v }), v => v.toFixed(2));
  slider("blacks", v => ({ command: "set_blacks", params: v }), v => v.toFixed(2));
  slider("straighten", v => ({ command: "set_straighten", params: v }), v => `${v.toFixed(1)}°`);
  slider("sharpen", v => ({ command: "set_sharpen", params: v }), v => v.toFixed(2));
  slider("sharpen_radius", v => ({ command: "set_sharpen_radius", params: v }), v => v.toFixed(2));
  slider("chroma_noise", v => ({ command: "set_chroma_noise", params: v }), v => v.toFixed(2));
  slider("saturation", v => ({ command: "set_saturation", params: v }), v => v.toFixed(2));
  slider("vibrance", v => ({ command: "set_vibrance", params: v }), v => v.toFixed(2));

  for (const button of document.querySelectorAll("[data-rotate]")) {
    button.addEventListener("click", () =>
      send({ command: "rotate_by", params: Number(button.dataset.rotate) }));
  }
  slider("temperature", v => ({ command: "set_temperature", params: v }), v => `${v | 0} K`);
  slider("tint", v => ({ command: "set_tint", params: v }), v => `${v | 0}`);

  document.getElementById("as-shot").addEventListener("click", () => {
    document.getElementById("temperature-value").textContent = "as shot";
    send({ command: "set_temperature", params: null });
  });

  for (const button of document.querySelectorAll("[data-zoom]")) {
    button.addEventListener("click", async () => {
      const factor = parseFloat(button.dataset.zoom);
      scale = button.hasAttribute("data-absolute") ? factor : scale * factor;
      // Anchor at the centre of the canvas: these are buttons, so there is no
      // cursor to hold still.
      const { viewport } = await invoke("snapshot");
      await send({
        command: "zoom_to",
        params: { scale, anchor: [viewport.size[0] / 2, viewport.size[1] / 2] },
      });
    });
  }

  document.querySelector("[data-fit]").addEventListener("click", async () => {
    await send({ command: "fit_to_view" });
    scale = (await invoke("snapshot")).viewport.scale;
  });

  for (const button of document.querySelectorAll("[data-pan]")) {
    const [dx, dy] = button.dataset.pan.split(",").map(Number);
    button.addEventListener("click", () => send({ command: "pan", params: { dx, dy } }));
  }

  // Pointer input over the *canvas* does not reach this page: the canvas is its
  // own X window, which is exactly what stops it fighting the webview. Drag and
  // scroll therefore need native event handling on that window, and until then
  // the view is driven by these buttons.
  invoke("snapshot").then(s => {
    scale = s.viewport.scale;
    log.textContent = `${s.image[0]}x${s.image[1]}`;
  });

  // Put the controls where the *session* says they are.
  //
  // The page is not the source of truth and never was — it just used to be the
  // only thing that changed the edit, so nobody noticed. Moving between
  // photographs restores each one's stored edit underneath the page, and a
  // slider left showing the last frame's exposure is worse than a wrong readout:
  // the next drag sends that stale value as if it were a decision.
  // Which slider the pointer is currently holding, so a sync does not yank the
  // thumb out from under a drag. Focus is the wrong test and was the first
  // attempt: a slider keeps focus after the click that moved it, so the readout
  // would update on navigation while the thumb stayed where it was — the two
  // halves of one control disagreeing, which is worse than either being wrong.
  let dragging = null;
  const TONE = ["exposure", "contrast", "highlights", "shadows", "whites", "blacks"];
  for (const id of [...TONE, "straighten", "sharpen", "sharpen_radius", "chroma_noise", "saturation", "vibrance", "temperature", "tint"]) {
    document.getElementById(id).addEventListener("pointerdown", () => (dragging = id));
  }
  document.addEventListener("pointerup", () => (dragging = null));

  const setSlider = (id, value, format) => {
    if (dragging !== id) document.getElementById(id).value = value;
    document.getElementById(id + "-value").textContent = format(value);
  };

  const sync = state => {
    setSlider("exposure", state.tone.exposure_ev, v => Number(v).toFixed(2));
    for (const id of TONE.slice(1)) {
      setSlider(id, state.tone[id], v => Number(v).toFixed(2));
    }
    setSlider("straighten", state.crop.angle_deg, v => `${Number(v).toFixed(1)}°`);
    setSlider("sharpen", state.detail.sharpen_amount, v => Number(v).toFixed(2));
    setSlider("sharpen_radius", state.detail.sharpen_radius, v => Number(v).toFixed(2));
    setSlider("chroma_noise", state.detail.chroma_noise, v => Number(v).toFixed(2));
    setSlider("saturation", state.colour.saturation, v => Number(v).toFixed(2));
    setSlider("vibrance", state.colour.vibrance, v => Number(v).toFixed(2));
    setSlider("tint", state.white_balance.tint, v => `${v | 0}`);
    const temp = state.white_balance.temperature_k;
    setSlider("temperature", temp ?? 5500, () => (temp === null ? "as shot" : `${temp | 0} K`));
  };

  // Polled rather than pushed, because the edit changes on the render loop's
  // schedule: a keypress leaves a request and the photograph is not loaded until
  // a frame or two later. Four times a second is far below anything a person
  // notices and costs a lock and a serialise.
  let seen = -1;
  setInterval(async () => {
    const s = await invoke("snapshot");
    if (s.generation !== seen) {
      seen = s.generation;
      sync(s.state);
    }
    // The canvas changes the selection too — clicking a cell, and
    // double-clicking to open it — and none of that passes through this page.
    // Without this the strip goes on describing the frame you were on two
    // clicks ago, which is a readout lying rather than merely lagging.
    show(await invoke("cull_view"));
  }, 250);

  // ---- Histogram -----------------------------------------------------------
  //
  // The counts come from the render loop, which develops the whole photograph
  // at its coarsest pyramid level and counts the eight-bit values an export
  // would write. So this describes the picture rather than the window: panning
  // and zooming do not change it, and cropping does.
  //
  // It is a survey of a reduced frame, which matters for one thing only. A
  // handful of blown pixels average away when the mosaic is halved four times,
  // so the clipping figures are a floor rather than an exact count — they
  // under-report small clipped areas and are right about large ones.
  const scope = document.getElementById("histogram");
  const clipWhite = document.getElementById("clip-white");
  const clipBlack = document.getElementById("clip-black");
  // Drawn in a 256-unit space — one unit a bin — and stretched to the column's
  // width by the transform. A bin is no longer a whole pixel, which mattered
  // when the widget was exactly 256 across and does not now: the channels are
  // composited additively, so two adjacent fills sharing a fractional edge sum
  // to full coverage instead of leaving the seam a source-over blend would.
  const BINS = 256;
  const WIDE = 328;
  const TALL = 84;

  const drawScope = data => {
    // Sized in device pixels so a bin is a whole pixel on a HiDPI screen. One
    // bin per CSS pixel is exactly 256 wide, which is why the widget is that
    // width and not a round number that would resample the bins.
    const dpr = window.devicePixelRatio || 1;
    if (scope.width !== Math.round(WIDE * dpr)) {
      scope.width = Math.round(WIDE * dpr);
      scope.height = Math.round(TALL * dpr);
    }
    const ctx = scope.getContext("2d");
    ctx.setTransform(scope.width / BINS, 0, 0, scope.height / TALL, 0, 0);
    ctx.fillStyle = "#141418";
    ctx.fillRect(0, 0, BINS, TALL);

    // Square root rather than linear. A photograph's histogram is usually one
    // tall spike and a long tail, and scaling to the peak linearly leaves the
    // tail invisible — including the last few bins, which are the ones the
    // clipping readout is about. Not logarithmic, which flattens the shape so
    // far that two quite different exposures look alike.
    const peak = Math.max(data.peak, 1);
    const trace = (bins, colour) => {
      ctx.fillStyle = colour;
      for (let i = 0; i < bins.length; i++) {
        if (bins[i] === 0) continue;
        const height = Math.sqrt(bins[i] / peak) * TALL;
        ctx.fillRect(i, TALL - height, 1, height);
      }
    };

    // Pure primaries, added together. That is what makes the reading work: three
    // channels that agree come to a neutral grey, so any colour left in the body
    // is one channel out there on its own. Mixing a little of the other channels
    // in to soften them — the first attempt — tints the whole body and destroys
    // exactly that.
    ctx.globalCompositeOperation = "lighter";
    trace(data.red, "#b00000");
    trace(data.green, "#00b000");
    trace(data.blue, "#0000b0");
    ctx.globalCompositeOperation = "source-over";

    // Luminance as a line over the top rather than a fill underneath. Filled, it
    // added to the three channels and the widget read as a white slab — losing
    // the colour information the primaries were chosen to carry.
    ctx.strokeStyle = "#d0d0d8";
    // In drawing units, so the line comes out about one device pixel however
    // wide the column and whatever the screen's scale.
    ctx.lineWidth = BINS / scope.width;
    ctx.beginPath();
    for (let i = 0; i < data.luma.length; i++) {
      const y = TALL - Math.sqrt(data.luma[i] / peak) * TALL;
      // Half a pixel across, or a one-pixel stroke straddles two rows and comes
      // out two pixels wide and grey.
      if (i === 0) ctx.moveTo(0.5, y + 0.5);
      else ctx.lineTo(i + 0.5, y + 0.5);
    }
    ctx.stroke();

    const share = n => (n === 0 ? "0%" : n / data.pixels < 0.0001 ? "<0.01%"
                        : `${((n / data.pixels) * 100).toFixed(2)}%`);
    clipWhite.textContent = `▲ ${share(data.clipped_white)}`;
    clipBlack.textContent = `▼ ${share(data.clipped_black)}`;
    clipWhite.classList.toggle("lit", data.clipped_white > 0);
    clipBlack.classList.toggle("lit", data.clipped_black > 0);
  };

  // Polled faster than the sliders are, and it costs nothing to do so: the
  // command returns nothing at all unless the generation it holds differs from
  // the one already drawn, so an idle editor pays a lock and a comparison.
  const exportLine = document.getElementById("export");
  let drawn = null;
  setInterval(async () => {
    const data = await invoke("histogram", { seen: drawn });
    if (data) {
      drawn = data.generation;
      drawScope(data);
    }

    // An export runs on its own thread and can outlive several photographs, so
    // its progress is asked for rather than pushed. It stays on screen when it
    // finishes: an export that ends by the readout disappearing tells you
    // nothing about whether it worked.
    const job = await invoke("export_progress");
    exportLine.classList.toggle("hidden", !job);
    if (!job) return;
    exportLine.classList.toggle("failed", (job.finished ?? "").startsWith("export failed"));
    exportLine.textContent = job.finished
      ? job.finished
      : `exporting ${job.done}/${job.total}` + (job.filename ? ` · ${job.filename}` : "");
  }, 100);

  // ---- Sections ------------------------------------------------------------
  //
  // Which ones you left open, kept between sessions. The alternative is deciding
  // for you every time a photograph opens, and the set of controls somebody
  // works with is theirs rather than ours.
  //
  // Every read and write is guarded: a webview with site data turned off throws
  // on the accessor itself rather than returning null, and a panel that failed
  // to draw because it could not remember a heading would be a poor trade.
  for (const section of document.querySelectorAll("details")) {
    const key = `open:${section.id}`;
    try {
      const saved = localStorage.getItem(key);
      if (saved !== null) section.open = saved === "1";
    } catch (e) { /* no storage; the markup's own defaults stand */ }
    section.addEventListener("toggle", () => {
      try { localStorage.setItem(key, section.open ? "1" : "0"); } catch (e) {}
    });
  }

  // ---- Culling -------------------------------------------------------------
  //
  // Keys are handled here rather than natively because a keyboard is the one
  // input that does *not* need the canvas window: the webview holds focus, and
  // this works identically on all three platforms without a line of per-OS code.
  // Pointer input over the canvas is the opposite case, and is why `canvas.rs`
  // exists.

  const strip = document.getElementById("cull");
  const show = view => {
    if (!view) return;
    strip.classList.remove("hidden");
    document.getElementById("frame").textContent = view.filename;
    document.getElementById("position").textContent = `${view.position} / ${view.total}`;
    document.getElementById("stars").textContent =
      "★".repeat(view.rating ?? 0) + "☆".repeat(5 - (view.rating ?? 0));
    const flag = document.getElementById("flag");
    flag.textContent = view.flag === "pick" ? "PICK" : view.flag === "reject" ? "REJECT" : "";
    flag.className = view.flag ?? "";
    const label = document.getElementById("label");
    label.textContent = view.colour ? view.colour.toUpperCase() : "";
    label.style.color = { red: "#e0705f", yellow: "#d8bf63", green: "#6fc27a", blue: "#6f9ade" }[view.colour] ?? "";
    document.getElementById("counts").textContent =
      `${view.picks} picked · ${view.rejects} rejected` +
      (view.marked ? ` · ${view.marked} marked${view.is_marked ? " ✓" : ""}` : "") +
      // A clipboard nobody can see is a key that sometimes does nothing.
      (view.copied ? " · settings copied" : "");
    setMode(view.mode);
  };

  // Told by the Rust side which arrangement this is. Route 3 hands the canvas
  // its own window and the page keeps its background; a cutout needs the page
  // to paint nothing where the photograph belongs.
  const cutout = location.search.includes("cutout");
  if (cutout) document.body.classList.add("cutout");

  // Under a cutout the webview owns every pixel, so the photograph gets no
  // pointer events of its own and the page has to pass them on. Where the
  // canvas has its own window this never runs — GTK delivers the same events
  // without a round trip, and both paths end in the same router, so a drag
  // means the same thing either way.
  if (cutout) {
    const chromeLeft = () =>
      document.getElementById("chrome").getBoundingClientRect().left;
    // Canvas pixels: the session works in the surface's own coordinates, and
    // the page is the only place that knows the device ratio.
    //
    // The test is horizontal now, and there is nothing to subtract: the
    // photograph starts at the window's origin, so a pointer is over it exactly
    // when it is left of the chrome.
    const at = event => {
      const dpr = window.devicePixelRatio || 1;
      return event.clientX >= chromeLeft()
        ? null
        : { x: event.clientX * dpr, y: event.clientY * dpr };
    };
    // Not `send`, which is already the command bus in this scope; this is the
    // other direction of traffic and shadowing it would be a trap.
    const forward = event => invoke("canvas_pointer", { event });

    addEventListener("pointerdown", event => {
      const p = at(event);
      if (!p) return; // On the chrome: that belongs to the controls.
      // Captured so a drag that leaves the window still reports where it went
      // and when it ended — without it, releasing outside leaves the canvas
      // believing the button is still down.
      event.target.setPointerCapture?.(event.pointerId);
      forward({ kind: "press", ...p, double: event.detail >= 2 });
    });
    addEventListener("pointermove", event => {
      if (!event.buttons) return; // Hovering is not a drag, and IPC is not free.
      const p = at(event);
      if (p) forward({ kind: "motion", ...p });
    });
    // Delivered wherever the pointer ended up, including over the chrome: a
    // release that never arrives leaves the canvas believing the button is
    // still down.
    addEventListener("pointerup", () => forward({ kind: "release" }));
    addEventListener("wheel", event => {
      const p = at(event);
      if (!p) return;
      // A wheel notch is about 100 pixels of `deltaY`; a line or a page is
      // already one step. Normalised here so the router sees one unit whatever
      // sent it, the same way GTK's direction and delta are.
      const notches = event.deltaMode === 0 ? event.deltaY / 100 : event.deltaY;
      forward({ kind: "scroll", ...p, notches });
      event.preventDefault();
    }, { passive: false });
  }

  const act = async (action, value) => {
    try {
      show(await invoke("cull", { action: value === undefined ? { action } : { action, value } }));
    } catch (e) {
      log.className = "refused";
      log.textContent = String(e);
    }
  };

  // A held arrow key repeats far faster than a RAW decodes. Every press is still
  // sent — the library keeps only the latest request and the render loop reads
  // it once per frame, so this coalesces for the same reason a slider drag does.
  function setMode(name) {
    if (document.getElementById("mode").textContent === name) return;
    document.getElementById("mode").textContent = name;
    // The grid is laid out from the canvas, so the view controls beside it are
    // about a photograph that is not on screen. Dimmed rather than removed, so
    // the panel does not jump when the mode changes.
    document.querySelector("main").style.opacity = name === "grid" ? 0.45 : 1;
  }

  document.addEventListener("keydown", event => {
    // Ctrl/Cmd+Z steps the *edit* back; shift, or Y, steps it forward. Bare Z
    // stays with culling, which had it first.
    //
    // Two undo histories in one application, and the seam is worth stating
    // rather than leaving someone to find: the develop controls and the
    // judgements are undone separately, because nothing joins their timelines —
    // the library outlives the session, and a session is rebuilt for every
    // photograph. Merging them is a design decision, not a refactor.
    if ((event.metaKey || event.ctrlKey) && !event.altKey) {
      const held = event.key.toLowerCase();
      if (held === "z" || held === "y") {
        send({ command: held === "y" || event.shiftKey ? "redo" : "undo" });
        event.preventDefault();
      }
      // E for export, and shift for the whole cull rather than this one frame.
      // The picker decides the rest: a name for one photograph, a folder for a
      // set, so the two cannot be asked for the wrong thing.
      if (held === "e") {
        invoke("export", { scope: event.shiftKey ? "picks" : "current" }).catch(e => {
          log.className = "refused";
          log.textContent = String(e);
        });
        event.preventDefault();
      }
      return;
    }
    if (event.altKey) return;
    const key = event.key;
    // A focused control owns its own keys. Without this, arrows move the slider
    // *and* the selection, and a digit rates the photograph while you are
    // trying to type into something — which was survivable with two sliders and
    // is not with six. Escape is the way back out, so it stays ours.
    const editing = event.target.closest("input, button, select, textarea");
    if (editing && key !== "Escape") return;
    if (editing) event.target.blur();
    if (key >= "0" && key <= "5") return act("rate", Number(key)), event.preventDefault();
    // Lightroom's colour keys, and pressing the same one again clears it.
    const labels = { "6": "red", "7": "yellow", "8": "green", "9": "blue" };
    if (labels[key]) return act("colour", labels[key]), event.preventDefault();
    switch (key.toLowerCase()) {
      // G and E, because that is what a Lightroom user's hands already do.
      case "g": act("grid"); break;
      // In crop the same two keys mean take it and throw it away, which is why
      // crop is a mode rather than a flag.
      case "enter":
        if (document.getElementById("mode").textContent === "crop") { act("crop_apply"); break; }
        act("loupe"); break;
      case "escape":
        if (document.getElementById("mode").textContent === "crop") { act("crop_cancel"); break; }
        act("loupe"); break;
      case "e": act("loupe"); break;
      // R for the crop tool, as in Lightroom; the brackets rotate, as in
      // Lightroom's Ctrl+[ and Ctrl+].
      case "r": act("crop"); break;
      case "[": send({ command: "rotate_by", params: -1 }); break;
      case "]": send({ command: "rotate_by", params: 1 }); break;
      // M sets a frame aside, C compares what you set aside.
      case "m": act("mark"); break;
      case "c": act("survey"); break;
      case "arrowright": case " ": act("next"); break;
      case "arrowleft": act("previous"); break;
      // Rows in the grid; neighbours in the loupe. Which one is resolved by the
      // shell, because only it knows how many cells fit across.
      case "arrowdown": act("select_by", 1); break;
      case "arrowup": act("select_by", -1); break;
      case "-": act("cells", -1); break;
      case "=": case "+": act("cells", 1); break;
      case "p": act("pick"); break;
      case "x": act("reject"); break;
      case "u": act("clear_flag"); break;
      // S takes this frame's look, A applies it to everything marked.
      case "s": act("copy_edit"); break;
      case "a": act("paste_edit"); break;
      case "z": act("undo"); break;
      default: return;
    }
    event.preventDefault();
  });

  invoke("cull_view").then(show);
</script>
