[package]
name = "rawkit-catalog"
description = "The library database: SQLite schema, forward-only migrations, and volume identity."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rawkit-editstate.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
rusqlite.workspace = true
blake3.workspace = true

# Volume identity. Kept per-target so a Linux build never sees them: the shared
# half of the decision (from_windows_root, from_macos_volume) is plain Rust and
# is tested everywhere, and only the system calls need these.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
