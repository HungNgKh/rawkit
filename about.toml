# cargo-about -- generates THIRD-PARTY.md, the attribution manifest Apache-2.0
# requires. Run `cargo about generate about.hbs > THIRD-PARTY.md` before cutting
# a release. Kept in sync with deny.toml by hand; they answer different
# questions (deny: "may we use this?", about: "have we credited it?").

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CDDL-1.0",
]

targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

workarounds = ["ring"]
