# cargo-deny — licence enforcement, wired up before the first real dependency
# lands. Rationale and the audit trail live in docs/licence-policy.md.
#
# Run locally:  cargo deny check
# CI runs `cargo deny check all` on every push (.github/workflows/ci.yml).

[graph]
# Check the licence graph for every OS we ship, not just the dev box. A
# Windows-only or macOS-only transitive dependency is exactly the kind of thing
# that would otherwise slip past a Linux-only audit.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[licenses]
# Outbound licence is Apache-2.0. Anything not on this list is refused by
# default -- adding an entry is a deliberate, reviewable act.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    # Added 2026-08-29 for jpeg-encoder, whose forward DCT descends from the
    # Independent JPEG Group's code. Permissive and FSF-recognised; its one real
    # obligation is an acknowledgement in the documentation, which NOTICE
    # carries. See docs/licence-policy.md.
    "IJG",
]
confidence-threshold = 0.93

# Per-crate exceptions: a licence that is NOT acceptable project-wide, tolerated
# in exactly one quarantined crate.
#
# Still empty, and *not* because nothing needs quarantining. LibRaw is CDDL and
# is linked, but the `libraw-rs-sys` crate declares MIT/Apache-2.0 for its own
# binding code, so cargo-deny never sees the CDDL at all — the check reads crate
# metadata, not vendored source. That gap is the reason docs/licence-policy.md
# requires a manual read of anything vendoring C or C++.
#
# CDDL is file-level copyleft: those files stay CDDL permanently and can never be
# relicensed under Apache-2.0, so they live behind the rawkit-decode boundary and
# nothing else in the workspace links them directly.
exceptions = []

# GPL/LGPL/AGPL are absent from `allow` on purpose, not by oversight:
#   - GPL-2.0-only is legally incompatible with Apache-2.0.
#   - LGPL (lensfun) would compromise later commercial/App Store distribution
#     of the v2 AI, and maker-embedded lens metadata makes it unnecessary.
# See docs/licence-policy.md before proposing to relax either.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The audit's conclusions, made executable. Every pure-Rust RAW decoder is
# LGPL-2.1 (dcraw ancestry), and LGPL plus Rust's static linking would oblige us
# to ship relinkable object files with every release. Documenting that is not
# enough -- in eighteen months someone will reasonably suggest "why not just use
# rawler?", and the build should answer instead of a person having to remember.
# See docs/licence-policy.md.
deny = [
    { crate = "rawler", reason = "LGPL-2.1. See docs/licence-policy.md: no permissive pure-Rust decoder exists; LibRaw in CDDL mode stays." },
    { crate = "rawloader", reason = "LGPL-2.1, same lineage and same conclusion as rawler." },
    { crate = "quickraw", reason = "LGPL-2.1, same lineage and same conclusion as rawler." },
]

[advisories]
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
