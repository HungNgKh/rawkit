# cargo-deny — licence enforcement, wired up before the first real dependency
# lands. Rationale and the audit trail live in docs/licence-policy.md.
#
# Run locally:  cargo deny check
# CI runs `cargo deny check all` on every push (.github/workflows/ci.yml).

[graph]
# Check the licence graph for every OS we ship, not just the dev box. A
# Windows-only or macOS-only transitive dependency is exactly the kind of thing
# that would otherwise slip past a Linux-only audit.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[licenses]
# Outbound licence is Apache-2.0. Anything not on this list is refused by
# default -- adding an entry is a deliberate, reviewable act.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    # Added 2026-08-29 with Tauri, which pulls five MPL-2.0 crates for CSP
    # parsing (cssparser, cssparser-macros, selectors, dtoa-short, option-ext).
    #
    # MPL-2.0 is *file-level* copyleft, the same shape as LibRaw's CDDL: those
    # files stay MPL and any modification to them stays MPL, but section 3.3
    # explicitly permits distributing the Larger Work under other terms. So
    # Apache-2.0 outbound is unaffected, the v2 AI can still be proprietary, and
    # there is no LGPL-style relinking obligation. The duty is to make the source
    # of those files available; they are unmodified upstream crates, so crates.io
    # is that, and cargo-about records them in THIRD-PARTY.md.
    #
    # This is why LGPL is refused and MPL is not: the difference is the relinking
    # requirement, not the word "copyleft".
    "MPL-2.0",
    # Added 2026-08-29 for jpeg-encoder, whose forward DCT descends from the
    # Independent JPEG Group's code. Permissive and FSF-recognised; its one real
    # obligation is an acknowledgement in the documentation, which NOTICE
    # carries. See docs/licence-policy.md.
    "IJG",
]
confidence-threshold = 0.93

# Per-crate exceptions: a licence that is NOT acceptable project-wide, tolerated
# in exactly one quarantined crate.
#
# Still empty, and *not* because nothing needs quarantining. LibRaw is CDDL and
# is linked, but the `libraw-rs-sys` crate declares MIT/Apache-2.0 for its own
# binding code, so cargo-deny never sees the CDDL at all — the check reads crate
# metadata, not vendored source. That gap is the reason docs/licence-policy.md
# requires a manual read of anything vendoring C or C++.
#
# CDDL is file-level copyleft: those files stay CDDL permanently and can never be
# relicensed under Apache-2.0, so they live behind the rawkit-decode boundary and
# nothing else in the workspace links them directly.
exceptions = []

# GPL/LGPL/AGPL are absent from `allow` on purpose, not by oversight:
#   - GPL-2.0-only is legally incompatible with Apache-2.0.
#   - LGPL (lensfun) would compromise later commercial/App Store distribution
#     of the v2 AI, and maker-embedded lens metadata makes it unnecessary.
# See docs/licence-policy.md before proposing to relax either.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The audit's conclusions, made executable. Every pure-Rust RAW decoder is
# LGPL-2.1 (dcraw ancestry), and LGPL plus Rust's static linking would oblige us
# to ship relinkable object files with every release. Documenting that is not
# enough -- in eighteen months someone will reasonably suggest "why not just use
# rawler?", and the build should answer instead of a person having to remember.
# See docs/licence-policy.md.
deny = [
    { crate = "rawler", reason = "LGPL-2.1. See docs/licence-policy.md: no permissive pure-Rust decoder exists; LibRaw in CDDL mode stays." },
    { crate = "rawloader", reason = "LGPL-2.1, same lineage and same conclusion as rawler." },
    { crate = "quickraw", reason = "LGPL-2.1, same lineage and same conclusion as rawler." },
]

[advisories]
yanked = "deny"
# Two entries, both the same decision made once. rawkit-shell depends on gtk and
# gdkx11 *directly* — to pack a native canvas widget beside the webview, which is
# the only arrangement of the three tested that works on Linux — so the rule
# below correctly fires on them.
#
# They are unmaintained rather than vulnerable: gtk-rs has moved to GTK4 and
# webkit2gtk still requires GTK3, so this is where Tauri's Linux backend lives
# and there is nowhere else to go until Tauri moves. Pinned to the versions Tauri
# already links, so this adds no code to the build that was not there — it only
# makes the dependency honest by naming it.
#
# Revisit when Tauri's Linux backend moves to GTK4 or webkitgtk-6.0.
ignore = [
    { id = "RUSTSEC-2024-0415", reason = "gtk: GTK3 bindings unmaintained. Required by webkit2gtk; see above." },
    { id = "RUSTSEC-2024-0417", reason = "gdkx11: same GTK3 family, same reason." },
]
# Vulnerabilities always fail, for every crate in the graph. *Unmaintained*
# notices only fail for crates this workspace depends on directly.
#
# Adding Tauri brought sixteen unmaintained advisories at once and not one
# vulnerability among them: the whole gtk-rs GTK3 binding family (GTK3 is what
# webkit2gtk requires, and gtk-rs has moved to GTK4), proc-macro-error, and the
# unic-* crates under urlpattern. None have a safe upgrade and none are ours to
# fix — the honest options were to relax the rule or to paste sixteen IDs into an
# ignore list that would rot the moment Tauri changed a dependency.
#
# Scoping to direct dependencies keeps the rule actionable: it fires exactly when
# we could do something about it. The cost is real and worth naming — an
# unmaintained transitive crate no longer announces itself, so a *vulnerability*
# in one is now the only thing that will.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
