[workspace]
resolver = "2"
members = [
    "crates/rawkit-editstate",
    "crates/rawkit-decode",
    "crates/rawkit-engine",
    "crates/rawkit-catalog",
    "crates/rawkit-export",
    "crates/rawkit-session",
    "crates/rawkit-shell",
    "crates/rawkit-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/HungNgKh/rawkit"
authors = ["HungNgKh"]

# Every dependency is declared here so licence auditing has one place to look.
# Adding one anywhere else is a review smell.
#
# The allowed-licence list is enforced by `cargo deny check licenses` in CI
# (see deny.toml and docs/licence-policy.md). Apache-2.0 outbound means
# GPL-2.0-only is categorically excluded and LGPL is avoided; the one planned
# exception is LibRaw's CDDL, quarantined inside rawkit-decode.
[workspace.dependencies]
rawkit-editstate = { path = "crates/rawkit-editstate", version = "0.0.1" }
rawkit-decode = { path = "crates/rawkit-decode", version = "0.0.1" }
rawkit-engine = { path = "crates/rawkit-engine", version = "0.0.1" }
rawkit-catalog = { path = "crates/rawkit-catalog", version = "0.0.1" }
rawkit-export = { path = "crates/rawkit-export", version = "0.0.1" }
rawkit-session = { path = "crates/rawkit-session", version = "0.0.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
# NFC normalisation for catalog paths. macOS filenames can arrive decomposed,
# and the same file spelled two ways is how a library grows duplicates.
unicode-normalization = "0.1"
# SQLite, statically linked. `bundled` on purpose: a catalog must open the same
# way on all three platforms, and depending on whatever libsqlite the host
# happens to ship is how one of them ends up with different pragma defaults.
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1"
# Volume identity, one platform each, and both already in the tree transitively
# -- declared here because rawkit-catalog now calls them directly and every
# dependency edge belongs in one file. Windows: GetVolumePathNameW and
# GetVolumeInformationW. macOS: statfs and getattrlist, whose `attrlist` struct
# and attribute bits come from libc rather than being spelled out by hand.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
libc = "0.2"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The LibRaw binding. The crate is MIT/Apache-2.0; the LibRaw C++ it vendors is
# CDDL, which cargo-deny cannot see -- see docs/licence-policy.md. Only
# rawkit-decode may depend on this.
libraw-rs-sys = "0.0.4"
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# Golden-test references are 16-bit PNGs so a reviewer can look at what changed;
# the export pipeline uses the same crate. Pure Rust, MIT/Apache-2.0.
png = "0.17"
# Little CMS, statically linked. The transform and the profile we embed then
# come from one source, so they cannot describe different things.
lcms2 = { version = "6", default-features = false, features = ["static"] }
# Carries an IJG-licensed forward DCT; see docs/licence-policy.md for why that
# licence is on the allowed list and what it obliges.
jpeg-encoder = "0.7"
jpeg-decoder = "0.3"
# The desktop shell. Only rawkit-shell may depend on these; the engine must stay
# usable headless, which is what keeps the golden tests and export honest.
# `macos-private-api` is what makes a transparent window possible on macOS, and
# a transparent window is what route 1 is. It bars *App Store* distribution and
# nothing else — notarised direct download, which is how a tool like this ships,
# is unaffected. Chosen deliberately over writing a child NSView: see the route
# notes in rawkit-shell.
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-build = "2"
# Linux only, and pinned to the versions Tauri already links so the GTK types
# are the same types. Used to pack a native widget beside the webview and hang
# the GPU surface on its own X window — see crates/rawkit-shell/src/canvas.rs.
gtk = "0.18"
gdkx11 = "0.18"
# Already in the tree under gdkx11; declared directly so its build script emits
# the -lX11 link flag. Needed for exactly one call: XInitThreads.
x11 = { version = "2", features = ["xlib"] }

# Rendering work is unusably slow in a debug build; keep dev fast but not naive.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
