[workspace]
resolver = "2"
members = [
    "crates/rawkit-editstate",
    "crates/rawkit-decode",
    "crates/rawkit-engine",
    "crates/rawkit-catalog",
    "crates/rawkit-export",
    "crates/rawkit-session",
    "crates/rawkit-shell",
    "crates/rawkit-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/HungNgKh/rawkit"
authors = ["HungNgKh"]

# Every dependency is declared here so licence auditing has one place to look.
# Adding one anywhere else is a review smell.
#
# The allowed-licence list is enforced by `cargo deny check licenses` in CI
# (see deny.toml and docs/licence-policy.md). Apache-2.0 outbound means
# GPL-2.0-only is categorically excluded and LGPL is avoided; the one planned
# exception is LibRaw's CDDL, quarantined inside rawkit-decode.
[workspace.dependencies]
rawkit-editstate = { path = "crates/rawkit-editstate", version = "0.0.1" }
rawkit-decode = { path = "crates/rawkit-decode", version = "0.0.1" }
rawkit-engine = { path = "crates/rawkit-engine", version = "0.0.1" }
rawkit-catalog = { path = "crates/rawkit-catalog", version = "0.0.1" }
rawkit-export = { path = "crates/rawkit-export", version = "0.0.1" }
rawkit-session = { path = "crates/rawkit-session", version = "0.0.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
blake3 = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The LibRaw binding. The crate is MIT/Apache-2.0; the LibRaw C++ it vendors is
# CDDL, which cargo-deny cannot see -- see docs/licence-policy.md. Only
# rawkit-decode may depend on this.
libraw-rs-sys = "0.0.4"
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# Golden-test references are 16-bit PNGs so a reviewer can look at what changed;
# the export pipeline uses the same crate. Pure Rust, MIT/Apache-2.0.
png = "0.17"
# Little CMS, statically linked. The transform and the profile we embed then
# come from one source, so they cannot describe different things.
lcms2 = { version = "6", default-features = false, features = ["static"] }
# Carries an IJG-licensed forward DCT; see docs/licence-policy.md for why that
# licence is on the allowed list and what it obliges.
jpeg-encoder = "0.7"
jpeg-decoder = "0.3"
# The desktop shell. Only rawkit-shell may depend on these; the engine must stay
# usable headless, which is what keeps the golden tests and export honest.
tauri = { version = "2", features = ["unstable"] }
tauri-build = "2"

# Rendering work is unusably slow in a debug build; keep dev fast but not naive.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
