name: ci

# Three OSes from commit one, while the surface area is small enough that
# divergence is a config change rather than a rewrite. The dev box is Linux,
# so Windows and macOS are the ones that have to be *proven*.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned channel and components from rust-toolchain.toml, so
      # all three runners compile with the identical compiler.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      # `-- -D warnings` is not redundant with RUSTFLAGS above: that denies
      # rustc lints, this denies clippy's own.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # The engine's GPU tests are opt-in: hosted runners have no real GPU, and
      # a test that silently skips is worse than one that is explicitly gated.
      # Linux gets a software Vulkan device so the wgpu path is exercised
      # somewhere; the golden render tests join this step in P0 step 8.
      - name: Install software Vulkan (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      # Scoped to the engine on purpose. The other `#[ignore]`d tests need a RAW
      # fixture, and fixtures are large and not redistributable, so they cannot
      # exist on a hosted runner. They are written to fail loudly when the file
      # is missing rather than pass quietly — which is right for a developer and
      # wrong for CI, so CI does not run them.
      - name: GPU-backed tests (Linux, lavapipe)
        if: matrix.os == 'ubuntu-latest'
        env:
          WGPU_BACKEND: vulkan
        run: cargo test -p rawkit-engine --all-features -- --ignored

      # The golden test is the only one that must run on *every* platform,
      # because it is the only one whose subject is the platforms themselves:
      # "same RAW + same EditState -> same pixels on Linux, Windows and macOS"
      # is not a claim a single runner can check. Linux has already run it in
      # the step above; these two are the ones that have to be proven.
      #
      # Each run prints its adapter and a hash per case, so three logs answer
      # "are these bit-identical or merely within tolerance?" for free.
      - name: Golden renders (macOS, Metal)
        if: matrix.os == 'macos-latest'
        run: cargo test -p rawkit-engine --test golden -- --ignored --nocapture
      - name: Golden renders (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo test -p rawkit-engine --test golden -- --ignored --nocapture

  deny:
    name: licences & advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enforces the allowed-licence list in deny.toml. This job existing before
      # the dependencies do is the entire point: over an 18-24 month build, an
      # incompatible transitive dependency slipping in unnoticed is far likelier
      # than a bad deliberate choice.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
